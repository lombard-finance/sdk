name: Publish
run-name: Publish ${{ github.event.inputs.package }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: Target
        required: true
        options:
          - sdk
          - sdk-common
          - sdk-solana
          - sdk-sui
          - sdk-starknet
          - sdk-devtools

# Required for npm trusted publishing via OIDC.
# See https://docs.npmjs.com/trusted-publishers
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    container:
      image: ${{ vars.AWS_ECR_REGISTRY }}/library/alpine-git-node-aws:latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-publish
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref || github.sha }}

      - name: Allow Git to access repo
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Debug Git status
        run: |
          echo "PWD: $(pwd)"
          ls -la
          git status

      - name: Set Git identity
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          echo "✅ Git identity configured successfully."

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1. Node 22 ships with npm 10.x.
      # We don't rely on a global upgrade landing on PATH inside this container;
      # the publish step below invokes the latest npm via `npx -y npm@latest`.
      - name: Show tool versions and OIDC env presence
        run: |
          node --version
          echo "default npm: $(npm --version)"
          echo "npx-resolved npm: $(npx -y npm@latest --version)"
          # We only log whether the OIDC env vars exist, not their values.
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && echo "ACTIONS_ID_TOKEN_REQUEST_URL: set" || echo "ACTIONS_ID_TOKEN_REQUEST_URL: MISSING"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" && echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: set" || echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: MISSING"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check internal dependencies are published
        env:
          PACKAGE_NAME: ${{ github.event.inputs.package }}
        run: node scripts/check-publish-deps.js "$PACKAGE_NAME"

      # Yarn's workspace:* protocol is not understood by npm. If we run
      # `npm publish` without this step, the published package.json would
      # contain literal "workspace:*" as a dependency range, which is
      # invalid on the npm registry and breaks consumer installs.
      #
      # This step rewrites the target package's package.json:
      #   - dependencies:     workspace:* → exact version from the monorepo (e.g. "3.4.0")
      #   - peerDependencies: workspace:* → "*" (consumer provides the version)
      - name: Resolve workspace dependencies for publishing
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const packagesDir = './packages';
          const versions = {};
          for (const dir of fs.readdirSync(packagesDir)) {
            const p = path.join(packagesDir, dir, 'package.json');
            if (!fs.existsSync(p)) continue;
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (pkg.name?.startsWith('@lombard.finance/')) versions[pkg.name] = pkg.version;
          }
          const target = path.join(packagesDir, '${{ github.event.inputs.package }}', 'package.json');
          const pkg = JSON.parse(fs.readFileSync(target, 'utf8'));
          let modified = false;
          for (const depType of ['dependencies', 'peerDependencies']) {
            if (!pkg[depType]) continue;
            for (const [name, range] of Object.entries(pkg[depType])) {
              if (!range.startsWith('workspace:')) continue;
              pkg[depType][name] = depType === 'peerDependencies' ? '*' : (versions[name] || '*');
              modified = true;
            }
          }
          if (modified) {
            fs.writeFileSync(target, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Resolved workspace deps in ' + target);
          }
          "

      - name: Build packages
        run: yarn turbo run build --filter=...@lombard.finance/${{ github.event.inputs.package }}

      # npm authenticates to the registry via the GitHub-issued OIDC token
      # (id-token: write granted at workflow level). Provenance attestations are
      # attached automatically by trusted publishing.
      #
      # Two things to neutralize so OIDC actually fires:
      #   - NODE_AUTH_TOKEN: setup-node exports a literal "XXXXX-XXXXX-..."
      #     placeholder when registry-url is set. We blank it so npm doesn't
      #     try to authenticate with a junk static token.
      #   - NPM_CONFIG_USERCONFIG: setup-node also points this at an .npmrc
      #     containing `_authToken=${NODE_AUTH_TOKEN}`. Point it at /dev/null
      #     so npm reads no static creds and falls back to OIDC.
      #
      # `npx -y npm@latest` is used instead of plain `npm` to guarantee we run
      # npm >= 11.5.1 (the minimum that supports trusted publishing). The
      # container ships npm 10.x and a global upgrade isn't guaranteed to land
      # ahead of the container's pre-installed npm on PATH.
      - name: Publish
        working-directory: ./packages/${{ github.event.inputs.package }}/
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          npx -y npm@latest publish \
            --access public \
            --registry https://registry.npmjs.org

      - name: Send Slack message for SDK publish
        uses: slackapi/slack-github-action@v2.1.1
        env:
          WORKFLOW_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ github.event.inputs.package }} has been published to NPM\n${{ env.WORKFLOW_URL }}"
