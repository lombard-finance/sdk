name: Publish
run-name: Publish ${{ inputs.package }} (${{ inputs.channel }}) from ${{ github.ref_name }}

# Every npm release of every package goes through this one file, because npm
# trusted publishing binds each package to a single workflow filename.
on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: Package to publish (`all` is only allowed with channel=canary)
        required: true
        options:
          - sdk
          - sdk-common
          - sdk-solana
          - sdk-sui
          - sdk-starknet
          - sdk-devtools
          - sdk-agent
          - sdk-agentkit
          - sdk-react
          - all
      channel:
        type: choice
        description: 'latest: package.json version to dist-tag latest (main only). prerelease: package.json X.Y.Z-suffix to dist_tag. canary: X.Y.Z-<dist_tag>.<run> to dist_tag.'
        required: true
        default: canary
        options:
          - latest
          - prerelease
          - canary
      dist_tag:
        type: string
        description: npm dist-tag for prerelease and canary, lowercase letters, digits and dashes (ignored for latest)
        required: true
        default: canary

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  IN_PACKAGE: ${{ inputs.package }}
  IN_CHANNEL: ${{ inputs.channel }}
  IN_DIST_TAG: ${{ inputs.dist_tag }}
  HUSKY: '0'

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      node_version: ${{ steps.inputs.outputs.node_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs and ref
        id: inputs
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          ORDER="$(node --input-type=module -e "import { PUBLISH_ORDER } from './scripts/publishable-packages.mjs'; console.log(PUBLISH_ORDER.join(' '))")"

          if [[ "$IN_PACKAGE" == "all" ]]; then
            PACKAGES="$ORDER"
          elif [[ " $ORDER " == *" $IN_PACKAGE "* ]]; then
            PACKAGES="$IN_PACKAGE"
          else
            fail "package '$IN_PACKAGE' is not publishable"
          fi

          [[ "$IN_CHANNEL" =~ ^(latest|prerelease|canary)$ ]] || fail "unknown channel '$IN_CHANNEL'"
          [[ "$IN_DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]] || fail "dist_tag must match ^[a-z][a-z0-9-]*\$"
          [[ "$IN_DIST_TAG" != "latest" ]] || fail "dist_tag 'latest' is reserved for channel=latest"

          # Mirrors the production environment's deployment branch policy.
          [[ "$GITHUB_REF" =~ ^refs/heads/(main|sdk-release/[A-Za-z0-9._@/-]+)$ ]] \
            || fail "publishing is only allowed from main or sdk-release/* (got $GITHUB_REF)"
          if [[ "$IN_CHANNEL" == "latest" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            fail "channel=latest is only allowed from main"
          fi
          if [[ "$IN_PACKAGE" == "all" && "$IN_CHANNEL" != "canary" ]]; then
            fail "package=all is only allowed with channel=canary"
          fi

          NODE_VERSION="$(tr -d '[:space:]' < .nvmrc)"
          [[ "$NODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail ".nvmrc must hold an exact X.Y.Z version"

          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check package names and versions
        env:
          PACKAGES: ${{ steps.inputs.outputs.packages }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          for pkg in $PACKAGES; do
            NAME="$(jq -r .name "packages/$pkg/package.json")"
            VERSION="$(jq -r .version "packages/$pkg/package.json")"
            [[ "$NAME" == "@lombard.finance/$pkg" ]] || fail "packages/$pkg is named '$NAME'"
            case "$IN_CHANNEL" in
              latest|canary)
                [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                  || fail "$NAME: channel=$IN_CHANNEL needs a plain X.Y.Z version, found '$VERSION'" ;;
              prerelease)
                [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]] \
                  || fail "$NAME: channel=prerelease needs an X.Y.Z-suffix version, found '$VERSION'" ;;
            esac
            if [[ "$IN_CHANNEL" != "canary" ]] && npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
              fail "${NAME}@${VERSION} is already on npm"
            fi
            echo "${NAME}@${VERSION} ok"
          done

      - name: Lint
        run: yarn lint

      # Runs before the build because the sdk bundle embeds its own version.
      - name: Set canary versions
        if: inputs.channel == 'canary'
        env:
          PACKAGES: ${{ steps.inputs.outputs.packages }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          node scripts/set-canary-versions.mjs --suffix "$IN_DIST_TAG" --build "$RUN_NUMBER" -- $PACKAGES

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test:required

      - name: Resolve workspace dependencies
        env:
          PACKAGES: ${{ steps.inputs.outputs.packages }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          node scripts/resolve-workspace-deps.mjs -- $PACKAGES

      - name: Check internal dependencies are published
        if: inputs.package != 'all'
        run: node scripts/check-publish-deps.js "$IN_PACKAGE"

      - name: Pack tarballs
        env:
          PACKAGES: ${{ steps.inputs.outputs.packages }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          OUT="$RUNNER_TEMP/npm-dist"
          mkdir -p "$OUT"
          : > "$OUT/manifest.tsv"
          for pkg in $PACKAGES; do
            FILE="$(cd "packages/$pkg" && npm pack --ignore-scripts --pack-destination "$OUT" --json | jq -r '.[0].filename')"
            NAME="$(tar -xOzf "$OUT/$FILE" package/package.json | jq -r .name)"
            VERSION="$(tar -xOzf "$OUT/$FILE" package/package.json | jq -r .version)"
            if tar -xOzf "$OUT/$FILE" package/package.json | grep -q '"workspace:'; then
              fail "$FILE still contains a workspace: range"
            fi
            printf '%s\t%s\t%s\n' "$FILE" "$NAME" "$VERSION" >> "$OUT/manifest.tsv"
            echo "packed ${NAME}@${VERSION} as $FILE"
          done

      - name: Upload tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-dist/
          if-no-files-found: error
          retention-days: 1

  # Holds the OIDC token, so it runs no repository code and installs nothing
  # except the pinned npm CLI; it only publishes the tarballs packed above.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
    env:
      NPM_VERSION: 11.20.0
      NPM_MIN_VERSION: 11.5.1

    steps:
      - name: Validate inputs and ref
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$IN_CHANNEL" =~ ^(latest|prerelease|canary)$ ]] || fail "unknown channel"
          [[ "$IN_DIST_TAG" =~ ^[a-z][a-z0-9-]*$ && "$IN_DIST_TAG" != "latest" ]] || fail "invalid dist_tag"
          if [[ "$IN_CHANNEL" == "latest" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            fail "channel=latest is only allowed from main"
          fi

      # No registry-url and no cache: an _authToken line in .npmrc blocks OIDC.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.build.outputs.node_version }}

      - name: Install npm with trusted publishing support
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          ACTUAL="$(npm --version)"
          LOWEST="$(printf '%s\n%s\n' "$NPM_MIN_VERSION" "$ACTUAL" | sort -V | head -n1)"
          [[ "$LOWEST" == "$NPM_MIN_VERSION" ]] || { echo "::error::npm $ACTUAL is older than $NPM_MIN_VERSION"; exit 1; }
          echo "npm $ACTUAL"

      - name: Assert no static registry credentials
        run: |
          set -euo pipefail
          [[ -z "${NODE_AUTH_TOKEN:-}" ]] || { echo "::error::NODE_AUTH_TOKEN must not be set"; exit 1; }
          for f in "$HOME/.npmrc" "$(npm config get userconfig)" "$(npm config get globalconfig)"; do
            if grep -qs '_authToken' "$f"; then
              echo "::error::$f contains an _authToken entry"; exit 1
            fi
          done

      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-dist

      - name: Publish
        id: publish
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          cd "$RUNNER_TEMP/npm-dist"
          TAG_ARGS=()
          [[ "$IN_CHANNEL" == "latest" ]] || TAG_ARGS=(--tag "$IN_DIST_TAG")
          SUMMARY=""
          [[ -s manifest.tsv ]] || fail "manifest.tsv is missing or empty"
          while IFS=$'\t' read -r FILE NAME VERSION; do
            [[ "$FILE" =~ ^lombard\.finance-sdk(-[a-z]+)?-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.tgz$ ]] || fail "unexpected tarball name '$FILE'"
            [[ "$NAME" =~ ^@lombard\.finance/sdk(-[a-z]+)?$ ]] || fail "unexpected package name '$NAME'"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "unexpected version '$VERSION'"
            if [[ "$IN_CHANNEL" == "latest" ]]; then
              [[ "$VERSION" != *-* ]] || fail "$NAME@$VERSION is a prerelease; it cannot go to latest"
            else
              [[ "$VERSION" == *-* ]] || fail "$NAME@$VERSION is not a prerelease; it cannot go to $IN_DIST_TAG"
            fi
            INNER="$(tar -xOzf "$FILE" package/package.json | jq -r '.name + "@" + .version')"
            [[ "$INNER" == "$NAME@$VERSION" ]] || fail "$FILE contains $INNER, expected $NAME@$VERSION"

            if [[ "$IN_CHANNEL" == "canary" ]] && npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "::notice::$NAME@$VERSION is already on npm from an earlier attempt of this run; skipping"
            else
              echo "Publishing $NAME@$VERSION ${TAG_ARGS[*]:-(dist-tag latest)}"
              npm publish "./$FILE" --access public --provenance --registry https://registry.npmjs.org "${TAG_ARGS[@]}"
            fi
            SUMMARY+="${NAME}@${VERSION}\\n"
          done < manifest.tsv
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Verify on registry
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          EXPECT_TAG="latest"
          [[ "$IN_CHANNEL" == "latest" ]] || EXPECT_TAG="$IN_DIST_TAG"
          while IFS=$'\t' read -r _FILE NAME VERSION; do
            SEEN=""
            for attempt in 1 2 3 4 5 6; do
              SEEN="$(npm view "$NAME@$VERSION" version 2> /dev/null || true)"
              [[ "$SEEN" == "$VERSION" ]] && break
              echo "waiting for $NAME@$VERSION (attempt $attempt)"
              sleep 10
            done
            [[ "$SEEN" == "$VERSION" ]] || fail "$NAME@$VERSION is not visible on npm"
            TAGGED="$(npm view "$NAME" "dist-tags.$EXPECT_TAG" 2> /dev/null || true)"
            [[ "$TAGGED" == "$VERSION" ]] || fail "$NAME dist-tag $EXPECT_TAG is '$TAGGED', expected $VERSION"
            ATTESTATION="$(npm view "$NAME@$VERSION" dist.attestations.url 2> /dev/null || true)"
            [[ -n "$ATTESTATION" ]] || fail "$NAME@$VERSION has no provenance attestation"
            echo "- \`$NAME@$VERSION\` on dist-tag \`$EXPECT_TAG\` with provenance" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/npm-dist/manifest.tsv"

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Published to npm (${{ inputs.channel }}) from `${{ github.ref_name }}`:\n${{ steps.publish.outputs.summary }}${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
