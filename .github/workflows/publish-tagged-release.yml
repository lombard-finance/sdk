name: Publish SDK tagged release
run-name: Publish ${{github.event.inputs.package}} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: Target
        required: true
        options:
          - sdk
          - sdk-common
          - sdk-solana
          - sdk-sui
          - sdk-starknet
          - sdk-devtools
      tag: 
        type: string
        description: 'npm tag to publish under (e.g. v3.1.0-canary, rc.5, etc)'
        required: true
jobs:
  publish:
    runs-on: [self-hosted]
    environment: sdk-releases
    container:
      image: ${{ vars.AWS_ECR_REGISTRY }}/library/alpine-git-node-aws:latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-publish
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref || github.sha }}

      - name: Allow Git to access repo
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Debug Git status
        run: |
          echo "PWD: $(pwd)"
          ls -la
          git status

      - name: Set Git identity
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          echo "✅ Git identity configured successfully."

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn turbo run build --filter=@lombard.finance/sdk-common --filter=@lombard.finance/sdk --filter=@lombard.finance/${{ github.event.inputs.package }}

      - name: Configure registry
        working-directory: ./packages/${{ github.event.inputs.package }}/
        run: |
          npm config set access public -ws=false -iwr
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPMJS_TOKEN }} -ws=false -iwr

      - name: Publish
        working-directory: ./packages/${{ github.event.inputs.package }}/
        run: npm publish --tag ${{ github.event.inputs.tag }}

      - name: Send Slack message for SDK publish
        uses: slackapi/slack-github-action@v2.1.1
        env: 
          WORKFLOW_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ github.event.inputs.package }}@${{ github.event.inputs.tag }} has been published to NPM\n${{ env.WORKFLOW_URL }}"