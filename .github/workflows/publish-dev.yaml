# .github/workflows/publish-dev.yml
name: Publish Dev (GitHub Packages)
run-name: Dev publish ${{ github.ref_name }}

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'dev/**'

env:
  HUSKY: '0'

jobs:
  build-and-test:
    # Runs directly on the hosted runner: git, tar and jq ship with the image,
    # Node comes from setup-node and Yarn 4 is vendored in .yarn/releases.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ci
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: License policy check
        run: yarn licenses:check

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test:required

  publish-dev:
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    env:
      PUBLISH_ORDER: "sdk-common sdk sdk-solana sdk-sui sdk-starknet sdk-devtools sdk-agent sdk-agentkit"

    steps:
      # No token in .git/config: the build below runs third-party code while
      # this job holds packages: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lombard-finance'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn turbo run build

      - name: Compute prerelease version
        id: version
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
          SHORT_SHA="${SHA:0:7}"
          VERSION="0.0.0-${SLUG}.${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Publish all packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          FAILED=""

          for pkg in $PUBLISH_ORDER; do
            PKG_DIR="./packages/$pkg"
            PKG_JSON="$PKG_DIR/package.json"
            [ -f "$PKG_JSON" ] || continue

            echo "Publishing @lombard-finance/${pkg}@${VERSION}..."

            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$PKG_JSON', 'utf8'));
              pkg.version = '$VERSION';
              pkg.name = pkg.name.replace('@lombard.finance/', '@lombard-finance/');
              for (const depType of ['dependencies', 'peerDependencies']) {
                if (!pkg[depType]) continue;
                for (const [name, range] of Object.entries(pkg[depType])) {
                  if (!range.startsWith('workspace:')) continue;
                  if (name.startsWith('@lombard.finance/')) {
                    pkg[depType][name.replace('@lombard.finance/', '@lombard-finance/')] = depType === 'peerDependencies' ? '*' : '$VERSION';
                    delete pkg[depType][name];
                  } else {
                    pkg[depType][name] = depType === 'peerDependencies' ? '*' : '$VERSION';
                  }
                }
              }
              pkg.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'restricted' };
              pkg.repository = { type: 'git', url: 'https://github.com/lombard-finance/sdk.git', directory: 'packages/$pkg' };
              fs.writeFileSync('$PKG_JSON', JSON.stringify(pkg, null, 2) + '\n');
            "

            cd "$PKG_DIR"
            if npm publish --tag dev --ignore-scripts; then
              echo "  Published"
            else
              echo "  FAILED"
              FAILED="${FAILED} ${pkg}"
            fi
            cd "$GITHUB_WORKSPACE"
          done

          if [ -n "$FAILED" ]; then
            echo "The following packages failed to publish:${FAILED}"
            exit 1
          fi
