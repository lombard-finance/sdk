yarnPath: .yarn/releases/yarn-4.9.1.cjs
nodeLinker: node-modules
enableGlobalCache: true

# Dependency install scripts do not run: CI installs in jobs that later publish
# packages, so a compromised transitive dependency must not execute code there.
# None of the packages that list one needs it: the native addons load a
# prebuilt binary or fall back to JavaScript, and esbuild and @swc/core resolve
# their binary through optional platform packages. The root workspace's own
# postinstall (husky) still runs. To allow one package, add
# `dependenciesMeta: { "<name>": { built: true } }` in the workspace that
# depends on it.
enableScripts: false
